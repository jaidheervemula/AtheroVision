# Runs every test on each push and pull request (GitHub → Actions tab).
name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: windows-latest            # the platform the team and the judges use
    defaults:
      run:
        working-directory: cardio_ai_hackathon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install exact package versions
        run: python -m pip install -r ../requirements-backend.txt
      - name: ML package tests (models load with hash checks)
        run: python -m unittest discover -s tests -v
      - name: Model service tests
        run: python -m unittest api.test_api -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: cp .env.example .env
      - run: npm test
      - run: npm run build
